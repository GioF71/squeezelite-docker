name: Publish Regular multi-arch Docker images

on:
  push:
    tags:
      - "release/*"
      - "feature/*"
      - "daily/*"
      - "v*" # release
      - "f*" # feature
      - "d*" # daily

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [ stable ]
        build_mode: [ std, sf, sf_ffmpeg, r2 ]
        binary_mode: [ full, pulse, alsa, alsa-bt ]
        exclude:
          - base: stable
            build_mode: r2
            binary_mode: full
          - base: stable
            build_mode: r2
            binary_mode: pulse
          - base: stable
            build_mode: r2
            binary_mode: alsa-bt
          - base: stable
            build_mode: sf
            binary_mode: alsa-bt
          - base: stable
            build_mode: sf_ffmpeg
            binary_mode: full
          - base: stable
            build_mode: sf_ffmpeg
            binary_mode: alsa-bt

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare for docker build
        id: prepare
        run: |
          chmod +x .github/scripts/prepare-docker-build.sh
          ./.github/scripts/prepare-docker-build.sh \
            "${{ secrets.DOCKER_USERNAME }}/squeezelite" \
            "${{ github.ref_type }}" \
            "${{ github.ref_name }}" \
            "${{ github.ref }}" \
            "${{ matrix.base }}" \
            "${{ matrix.build_mode }}" \
            "${{ matrix.binary_mode }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BASE_IMAGE=${{ steps.prepare.outputs.BASE_IMAGE }}
            BUILD_MODE=${{ matrix.build_mode }}
            BINARY_MODE=${{ matrix.binary_mode }}
          platforms: ${{ steps.prepare.outputs.BUILD_PLATFORMS }}
          push: true
          tags: ${{ steps.prepare.outputs.RELEASE_TAGS }}
